ac:['复合后的第一次正式谈话，不谈感情，只谈规则：钱怎么算、吵架怎么停、各自的独处时间怎么保。写下来，两个人都留一份。这条听起来最不浪漫，但它救的关系最多。','设一个三个月的观察点。到那天只问自己一个问题：「这三个月里，我有没有一次为了不吵架而咽下真话？」有，就说出来。','别把复合的事告诉太多人。外人的期待会变成你们的压力，而这段关系现在最不需要的就是观众。'],

ex:[['你算的不是感情账，是回本账','所以越算越亏','「我为他做了那么多」这句话，本质是在算投入产出。感情一旦开始算账，就已经不是感情了。这不是你的错，但你需要看见它。'],['就算复合，那几年也回不来','你可能在追一个不存在的东西','你想回到的不是他身边，是当时那个状态的自己。这个目标，任何复合都完成不了。'],['不甘心会伪装成深情，而且装得很像','连你自己都被骗过去了','判断方法：想象他现在过得很好、有了新的伴侣、看起来很幸福。你的第一反应是「那我也放心了」，还是「凭什么」。后者就是不甘。']],

/* ============================================================
   【以下为通用逻辑，换主题不用改】
   ============================================================ */
var N=QS.length, cur=0, ans=Array(N).fill(null), last=null;
document.getElementById('ptot').textContent=N;

function show(id){document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function startQ(){cur=0;ans=Array(N).fill(null);loadQ(0);show('p1');}
function restart(){show('p0');}

function loadQ(n){
  document.getElementById('qnum').textContent='Q'+String(n+1).padStart(2,'0')+' / '+N;
  document.getElementById('qtext').textContent=QS[n].q;
  document.getElementById('pf').style.width=Math.round((n+1)/N*100)+'%';
  document.getElementById('pnum').textContent=n+1;
  document.getElementById('hint').textContent = n>=16
    ? '💡 最后几题最扎心，别修饰，选真实反应'
    : '💭 选第一反应，不要选「应该怎样」的那个答案';
  var el=document.getElementById('opts');el.innerHTML='';
  QS[n].o.forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'+(ans[n]===o[0]?' sel':'');
    b.dataset.v=o[0];
    b.innerHTML='<span class="ol">'+o[0]+'</span><span>'+o[1]+'</span>';
    b.onclick=function(){pick(o[0]);};
    el.appendChild(b);
  });
  var bP=document.getElementById('bP');
  bP.disabled=(n===0);bP.style.opacity=(n===0?'0.35':'1');
  document.getElementById('bN').textContent=(n===N-1?'看结论 →':'下一页 →');
}
function pick(v){
  ans[cur]=v;
  document.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('sel',b.dataset.v===v);});
}
function nextQ(){if(cur>=N-1){calc();return;}cur++;loadQ(cur);}
function prevQ(){if(cur>0){cur--;loadQ(cur);}}

// 标准化：把原始分转成 z 分，消除各维度量纲差异
function toZ(uv){return uv.map(function(v,i){return (v-MEAN[i])/SD[i];});}
// z 空间欧氏距离：越小越像
function dist(a,b){var s=0;for(var i=0;i<a.length;i++){var d=a[i]-b[i];s+=d*d;}return Math.sqrt(s);}

function calc(){
  var uv=Array(10).fill(0),mot={acc:0,bst:0,fad:0,unk:0},prs={raw:0,msk:0,fwd:0,bck:0},tpo={love:0,unw:0,lone:0};
  QS.forEach(function(q,i){
    if(!ans[i])return;
    var o=q.o.find(function(x){return x[0]===ans[i];});
    if(!o||!o[2])return;
    Object.keys(o[2]).forEach(function(k){
      var idx=DK.indexOf(k);
      if(idx>=0)uv[idx]+=o[2][k];
      else if(mot.hasOwnProperty(k))mot[k]+=o[2][k];
      else if(prs.hasOwnProperty(k))prs[k]+=o[2][k];
      else if(tpo.hasOwnProperty(k))tpo[k]+=o[2][k];
    });
  });
  var top=function(o,d){var ks=Object.keys(o);var m=ks.reduce(function(a,b){return o[a]>=o[b]?a:b;});return o[m]>0?m:d;};
  var motK=top(mot,'unk'), prsK=top(prs,'raw'), tpoK=top(tpo,'love');
  var zuv=toZ(uv);
  var scored=TYPES.map(function(t){return {t:t,d:dist(zuv,t.v)+(PEN[t.k]||0)};});
  scored.sort(function(a,b){return a.d-b.d;});
  var win=scored[0].t, winD=dist(zuv,win.v);
  var norm=Math.max(0,Math.min(1,1-winD/D0));
  var fit=Math.round(win.fr[0]+(win.fr[1]-win.fr[0])*norm);
  last={t:win,fit:fit,uv:uv,zuv:zuv,oth:scored.slice(1,5),motK:motK,prsK:prsK,tpoK:tpoK};
  render(last);
  show('p2');
}

function card(id,lbl,html,cls){
  var el=document.getElementById(id);
  el.className='card'+(cls?' '+cls:'');
  el.innerHTML='<div class="cl">'+lbl+'</div><div class="ct">'+html+'</div>';
}

function render(R){
  var T=R.t;
  document.getElementById('rH').innerHTML=
    '<div class="rf">'+T.f+'</div>'+
    '<div class="rn">定音</div>'+
    '<div class="vbig">'+T.vc+'</div>'+
    '<div class="vtype">'+T.n+'</div>'+
    '<div class="rvs">'+T.vs+'</div>'+
    '<div class="rfit"><div class="rfitn">'+R.fit+'%</div><div class="rfitl">复合成功率</div></div>'+
    '<div class="rwin">'+T.win+'</div>'+
    '<div class="rvd">'+T.vd+'</div>';

  card('rV','🎯 这个结论是怎么来的',T.nr.split('|').map(function(x){return '<p>'+x+'</p>';}).join(''));

  var xH='<div class="cl">📋 三件你必须先接受的事</div>';
  T.ex.forEach(function(e,i){
    xH+='<div class="ei"'+(i===T.ex.length-1?' style="border:none;padding-bottom:0"':'')+'>'+
        '<div class="ew">'+e[0]+'</div><div class="em">'+e[1]+'</div><div class="ey">'+e[2]+'</div></div>';
  });
  document.getElementById('rX').innerHTML=xH;

  document.getElementById('rR').innerHTML='<div class="cl">⚠️ 你最可能栽在哪一步</div><div class="ct">'+T.rk+'</div>';

  var mx=Math.max.apply(null,R.uv.concat([1]));
  var dH='<div class="cl">📊 你的十维剖面（Top 5）</div>';
  R.uv.map(function(v,i){return{n:DN[i],v:v};}).sort(function(a,b){return b.v-a.v;}).slice(0,5).forEach(function(d){
    var p=Math.round(Math.max(0,d.v)/mx*88);
    dH+='<div class="bi"><div class="bn">'+d.n+'</div><div class="bk"><div class="bf" data-p="'+p+'"></div></div><div class="bv">'+p+'</div></div>';
  });
  document.getElementById('rD').innerHTML=dH;

  var mH='<div class="cl">🧭 三条关键轴</div>';
  mH+='<div class="ey" style="margin-bottom:10px"><b>分开的方式 · </b>'+MOTlb[R.motK]+'　'+MOTtx[R.motK]+'</div>';
  mH+='<div class="ey" style="margin-bottom:10px"><b>你现在的状态 · </b>'+PRSlb[R.prsK]+'　'+PRStx[R.prsK]+'</div>';
  mH+='<div class="ey"><b>你真正想要的 · </b>'+TPOlb[R.tpoK]+'　'+TPOtx[R.tpoK]+'</div>';
  document.getElementById('rM').innerHTML=mH;

  var oH='<div class="cl">🔍 你也可能偏向这几种</div>';
  var ds=R.oth.map(function(s){return s.d;});
  var dmin=Math.min.apply(null,ds), dmax=Math.max.apply(null,ds);
  R.oth.forEach(function(s){
    var p=(dmax-dmin<0.01)?70:Math.max(10,Math.round(88-78*(s.d-dmin)/(dmax-dmin)));
    oH+='<div class="bi"><div class="bn" style="width:86px">'+s.t.f+' '+s.t.n+'</div><div class="bk"><div class="bg" data-p="'+p+'"></div></div><div class="bv">'+p+'</div></div>';
  });
  document.getElementById('rO').innerHTML=oH;

  var aH='<div class="cl">📌 接下来这么做</div>';
  T.ac.forEach(function(a,i){
    aH+='<div class="ti"><div class="tn">'+(i+1)+'</div><div>'+a+'</div></div>';
  });
  document.getElementById('rA').innerHTML=aH;

  setTimeout(function(){
    document.querySelectorAll('.bf,.bg').forEach(function(el){el.style.width=el.dataset.p+'%';});
  },150);
}

function copyResult(){
  if(!last)return;
  var T=last.t;
  var s='【'+CFG.brand+'】'+T.vc+'\n'+
        '「'+T.n+'」复合成功率 '+last.fit+'%\n'+
        T.vs+'\n'+
        '分开方式·'+MOTlb[last.motK]+'｜状态·'+PRSlb[last.prsK]+'｜驱动·'+TPOlb[last.tpoK];
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){alert('结论已复制，去粘贴吧');},function(){prompt('复制这段：',s);});
  }else{ prompt('复制这段：',s); }
}
